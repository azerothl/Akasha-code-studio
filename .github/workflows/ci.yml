name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, unit and browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser tests (mocked daemon API)
        run: npm run test:e2e -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload browser report, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
            docs/screenshots/tickets-*.png
          if-no-files-found: ignore
          retention-days: 14
