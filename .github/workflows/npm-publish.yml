name: npm publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to stage (for example v0.10.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm CLI with staged publishing support
        run: npm install --global npm@11.15.0
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$expected_tag" >/dev/null; then
            echo "::error::Release tag $expected_tag does not exist on origin"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Stage npm package for maintainer approval
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
